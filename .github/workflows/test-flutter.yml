name: Test Flutter vierge iOS (IPA non signé)
 
on:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: macos-latest
    steps:
      # Même version de Flutter que FluffyChat (.fvmrc)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
 
      - name: Créer une app Flutter minimale
        run: flutter create --org com.florent --project-name testflutter --platforms ios app
 
      # Écran vert avec un grand texte : impossible à confondre avec un écran blanc
      - name: Écrire l'écran de test
        working-directory: app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          void main() => runApp(const MaterialApp(debugShowCheckedModeBanner: false, home: Scaffold(backgroundColor: Colors.green, body: Center(child: Text('FLUTTER OK', style: TextStyle(fontSize: 44, color: Colors.white))))));
          EOF
 
      - name: Compiler sans signature
        working-directory: app
        run: flutter build ios --release --no-codesign
 
      - name: Fabriquer l'IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry TestFlutter-unsigned.ipa Payload
 
      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: TestFlutter-unsigned-ipa
          path: app/TestFlutter-unsigned.ipa
