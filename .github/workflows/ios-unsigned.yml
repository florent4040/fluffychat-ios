name: FluffyChat iOS (IPA non signé)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou branche de FluffyChat à compiler (ex: main ou un tag de version)"
        default: "main"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Récupérer le code officiel de FluffyChat
        uses: actions/checkout@v4
        with:
          repository: krille-chan/fluffychat
          ref: ${{ github.event.inputs.ref }}

      # Le dépôt officiel contient un fichier .tool_versions.yaml à la racine.
      # On y cherche la version de Flutter ; si rien n'est trouvé, on prend la dernière stable.
      - name: Détecter la version de Flutter du projet
        id: flutter_version
        run: |
          VERSION=""
          if [ -f .tool_versions.yaml ]; then
            echo "--- .tool_versions.yaml ---"
            cat .tool_versions.yaml
            VERSION=$(grep -i flutter .tool_versions.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          fi
          echo "Version de Flutter détectée : '${VERSION}'"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      # FluffyChat a besoin de Rust (vodozemac, compilé pendant le build iOS)
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # Xcode plante pendant la résolution des paquets Swift (Firebase...) sur le runner.
      # On force Flutter à utiliser CocoaPods à la place.
      - name: Désactiver Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Dépendances
        run: flutter pub get

      # On n'utilise pas scripts/build-ios.sh : il suppose un compte développeur
      # et une signature gérée par Xcode. Ici on compile sans signature.
      - name: Compiler sans signature
        run: flutter build ios --release --no-codesign

      - name: Fabriquer l'IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry FluffyChat-unsigned.ipa Payload

      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: FluffyChat-unsigned-ipa
          path: FluffyChat-unsigned.ipa
